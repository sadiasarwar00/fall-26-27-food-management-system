<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login | Khabar Ghor</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="auth">
  <form action="dashboard.html" method="get">
    <h1>Admin login</h1>
    <p class="sub">Khabar Ghor restaurant system</p>
    <label for="email">Email</label>
    <input id="email" type="email" name="email" required>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" required>
    <button type="submit">Log in</button>
    <p class="note">Admin accounts are created by the restaurant owner. There is no sign up for admin.</p>
    <p class="note"><a href="../index.html">Back to home</a></p>
  </form>
</div>
<script src="../js/auth.js"></script>
</body>
</html>
